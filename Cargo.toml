[package]
name = "process-display-helper-win"
version = "1.0.1"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = true }
ferrisetw = "1.2"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "chrono"] }
tray-icon = "0.24"
windows = { version = "0.62", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
