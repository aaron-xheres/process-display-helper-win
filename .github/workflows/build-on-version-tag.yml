name: Build on Version Tag Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build release binary
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --locked

      - name: Prepare release asset
        shell: pwsh
        run: |
          $assetName = "process-display-helper-win-${{ github.ref_name }}-windows-x64.exe"
          Copy-Item "target/release/process-display-helper-win.exe" "target/release/$assetName"

      - name: Upload asset to tag release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/process-display-helper-win-${{ github.ref_name }}-windows-x64.exe
          fail_on_unmatched_files: true
          overwrite_files: true
